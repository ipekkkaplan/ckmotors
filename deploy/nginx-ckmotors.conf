# Nginx ters proxy yapılandırması — ckmotors.com.tr
#
# Sunucuya kopyalama:
#   sudo cp deploy/nginx-ckmotors.conf /etc/nginx/sites-available/ckmotors
#   sudo ln -s /etc/nginx/sites-available/ckmotors /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Ardından certbot bu dosyayı otomatik düzenleyip 443 (HTTPS) bloğunu ekleyecektir:
#   sudo certbot --nginx -d ckmotors.com.tr -d www.ckmotors.com.tr
#
# Not: Bu dosya nginx.conf'un http{} bloğu içine (sites-enabled üzerinden)
# dahil edildiği için, en üst seviyedeki limit_req_zone tanımları geçerlidir.
# Bunlar, uygulama içindeki (src/server.ts) hız sınırlamasına ek bir savunma
# katmanıdır — istekler Node'a hiç ulaşmadan burada reddedilir. Gerçek hacimli
# bir DDoS saldırısına karşı en etkili koruma yine de Cloudflare gibi bir
# CDN/proxy'yi domain'in önüne almaktır (bkz. BENIOKU.md > Güvenlik).
limit_req_zone $binary_remote_addr zone=ckmotors_genel:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=ckmotors_giris:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ckmotors.com.tr www.ckmotors.com.tr;

    # Multer'daki 5 MB resim yükleme sınırına bir miktar pay bırakır.
    client_max_body_size 6M;

    # Admin giriş uç noktası: dakikada birkaç denemeyle sınırlı (kaba kuvvet koruması).
    location = /api/admin/giris {
        limit_req zone=ckmotors_giris burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=ckmotors_genel burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
